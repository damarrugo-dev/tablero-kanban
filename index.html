<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablero Kanban</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232f6fed'/><rect x='5' y='6' width='6' height='20' rx='2' fill='white'/><rect x='13' y='6' width='6' height='13' rx='2' fill='white'/><rect x='21' y='6' width='6' height='8' rx='2' fill='white'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
</head>
<body>
  <header class="topbar">
    <input id="boardTitle" class="board-title" aria-label="Nombre del tablero" maxlength="80">
    <div class="tools">
      <input id="search" type="search" placeholder="Buscar tarjeta…" aria-label="Buscar tarjeta">
      <select id="filterResp" aria-label="Filtrar por responsable">
        <option value="">Todos los responsables</option>
      </select>
      <button id="addColumn" class="btn">+ Proceso</button>
      <button id="addLane" class="btn">+ Carril</button>
      <button id="shareBtn" class="btn">Compartir</button>
      <button id="exportBtn" class="btn">Exportar</button>
      <button id="userChip" class="user-chip" title="Cambiar mi nombre"></button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="board" class="board" aria-live="polite">
    <p class="loading">Cargando tablero…</p>
  </main>

  <!-- Ventana de una tarjeta -->
  <dialog id="cardDialog" class="card-dialog">
    <div id="cardDialogBody"></div>
  </dialog>

  <!-- Ventana de pregunta / confirmación -->
  <dialog id="askDialog" class="ask-dialog">
    <form method="dialog" id="askForm">
      <h2 id="askTitle"></h2>
      <p id="askHint" class="hint"></p>
      <input id="askInput" autocomplete="off" maxlength="200">
      <div class="ask-actions">
        <button value="cancel" formnovalidate class="btn">Cancelar</button>
        <button value="ok" id="askOk" class="btn primary">Aceptar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
